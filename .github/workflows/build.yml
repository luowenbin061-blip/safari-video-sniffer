name: build-ipa

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '_ci/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Inspect project (schemes / targets into the log)
        continue-on-error: true
        run: |
          xcodebuild -project VideoSniffer.xcodeproj -list >> xcodegen.log 2>&1 || true

      - name: Build (unsigned)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project VideoSniffer.xcodeproj \
            -scheme VideoSniffer \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1
          code=$?
          echo "xcodebuild exit code: $code" | tee -a build.log
          exit $code

      - name: Pseudo-sign with ldid
        if: steps.build.outcome == 'success'
        run: |
          brew install ldid
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          # CODE_SIGNING_ALLOWED=NO 编出来的二进制连 LC_CODE_SIGNATURE 都没有，
          # iOS 加载 appex 时会拒绝 -> Safari 里显示「扩展不可用」。
          # 这里用 ldid 补一个 ad-hoc 签名。TrollStore 安装时还会再签一遍，不冲突。
          for ext in "$APP"/PlugIns/*.appex; do
            [ -e "$ext" ] || continue
            EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$ext/Info.plist")
            echo "sign appex: $ext/$EXEC"
            ldid -S "$ext/$EXEC"
            echo "--- appex LC_CODE_SIGNATURE 检查 ---"
            otool -l "$ext/$EXEC" | grep LC_CODE_SIGNATURE || echo "  !! 还是没签上"
          done
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "sign app: $APP/$EXEC"
          ldid -S "$APP/$EXEC"
          echo "--- app LC_CODE_SIGNATURE 检查 ---"
          otool -l "$APP/$EXEC" | grep LC_CODE_SIGNATURE || echo "  !! 还是没签上"

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "没有找到 .app，打包中止" | tee -a build.log
            exit 1
          fi
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          echo "--- Payload 内容 ---"
          find out/Payload -maxdepth 3 | head -60
          echo "--- appex 检查 ---"
          find out/Payload -name "*.appex" -print
          cd out && zip -qry ../VideoSniffer-unsigned.ipa Payload
          ls -la ../VideoSniffer-unsigned.ipa

      - name: Publish build log back to repo
        if: always()
        run: |
          mkdir -p _ci
          {
            echo "########## xcodegen.log ##########"
            cat xcodegen.log 2>/dev/null || echo "(没有 xcodegen.log)"
            echo
            echo "########## build.log ##########"
            cat build.log 2>/dev/null || echo "(没有 build.log)"
          } > _all.log
          if [ -s _all.log ]; then
            { head -c 130000 _all.log; echo; echo "=== (中间省略) ==="; echo; tail -c 130000 _all.log; } > _ci/build.log
          else
            echo "no logs generated" > _ci/build.log
          fi
          find build/Build/Products -maxdepth 3 -type d > _ci/products.txt 2>/dev/null || echo "no products" > _ci/products.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f _ci/
          git commit -m "ci: build log for run ${{ github.run_number }} [skip ci]" || echo "nothing to commit"
          # 构建期间可能有别的推送抢了 main，先 rebase 再推，避免 non-fast-forward
          git pull --rebase --autostash origin main || echo "rebase 失败，忽略"
          git push || echo "push failed"

      - name: Fail the job if the build actually failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "xcodebuild 失败了 —— 显式标失败，免得 continue-on-error 把结论伪装成 success"
          exit 1

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VideoSniffer-ipa
          path: VideoSniffer-unsigned.ipa
          if-no-files-found: error

      - name: Create release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 视频嗅探 v1.0.${{ github.run_number }}
          body: |
            未签名 IPA。用 TrollStore 直接安装，或用自签工具（轻松签 / AltStore）签名后安装。
            装完记得去 设置 → Safari → 扩展 里打开开关。
          files: VideoSniffer-unsigned.ipa
          draft: false
